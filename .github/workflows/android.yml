
name: Build Android Geode Mod

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract source
        run: unzip -oq Predictive-Input-Buffer-Android-Port.zip -d .

      - name: Fix setting listener types
        run: |
          sed -i 's/listenForSettingChanges("enabled"/listenForSettingChanges<bool>("enabled"/' Predictive-Input-Buffer-Android-Port/src/main.cpp
          sed -i 's/listenForSettingChanges("normal-ticks"/listenForSettingChanges<int64_t>("normal-ticks"/' Predictive-Input-Buffer-Android-Port/src/main.cpp
          sed -i 's/listenForSettingChanges("wave-ticks"/listenForSettingChanges<int64_t>("wave-ticks"/' Predictive-Input-Buffer-Android-Port/src/main.cpp

                  - name: Optimize prediction workload
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("Predictive-Input-Buffer-Android-Port/src/main.cpp")
          s = p.read_text()

          old = "int targetHorizon = isMiniWave ? 50 : (isWave ? 65 : 160);"
          new = "int targetHorizon = isMiniWave ? 50 : (isWave ? 65 : 80);"
          if old not in s and new not in s:
              raise SystemExit("Prediction horizon not found")
          s = s.replace(old, new, 1)

          old_loop = "for (int delay = 1; delay <= maxDelayFrames; delay++) {"
          new_loop = "for (int delay = 1; delay <= maxDelayFrames; delay++) {"
          if old_loop not in s:
              raise SystemExit("Delay scan loop not found")
          s = s.replace(old_loop, new_loop, 1)

          p.write_text(s)
          PY
          
      - name: Export source for review
        run: |
          cp Predictive-Input-Buffer-Android-Port/src/main.cpp android-main-review.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-main-review.txt
          git commit -m "Export Android source for review" || exit 0
          git push

      - name: Build Android64
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Android64
          sdk: given
          path: ./Predictive-Input-Buffer-Android-Port

      - name: Upload .geode
        uses: actions/upload-artifact@v4
        with:
          name: Predictive-Input-Buffer-Android64
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
